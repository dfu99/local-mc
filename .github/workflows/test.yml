name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke import
        run: python -c "from lmc.server import create_app; create_app()"

      # The real-claude smoke test in tests/test_claude_agent.py is gated
      # by shutil.which('claude'). It will skip in CI (where the binary
      # isn't installed) and execute when run on a developer machine that
      # has Claude Code on PATH. That's intentional — CI proves the rest
      # of the suite passes on Windows; the real-binary verification has
      # to happen on a developer box.
      - name: Run pytest
        run: python -m pytest -q tests/

  build-wheel:
    name: build wheel + verify web/ bundled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: Inventory wheel contents
        shell: bash
        run: |
          set -e
          WHEEL=$(ls dist/local_mc-*.whl | head -1)
          python -m zipfile -l "$WHEEL"
          # The web/ frontend must ship in the wheel — without it the
          # served UI falls back to the placeholder JSON page.
          python -m zipfile -l "$WHEEL" | grep -E 'web/(index\.html|app\.js|style\.css)'
